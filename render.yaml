# Render Blueprint Specification for GovEaseAI
# AI-Powered Government Service Automation Platform
# https://render.com/docs/blueprint-spec

version: "1"

databases:
  # 1. Managed PostgreSQL Database
  - name: goveaseai-db
    plan: free
    region: oregon
    databaseName: goveaseai
    user: goveaseai_user

services:
  # 2. FastAPI Backend Web Service
  - type: web
    name: goveaseai-backend
    runtime: python
    rootDir: Backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: goveaseai-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: AI_PROVIDER
        value: agentrouter
      - key: AGENTROUTER_API_KEY
        sync: false
      - key: AGENTROUTER_BASE_URL
        value: https://co.agentrouter.org/v1
      - key: AGENTROUTER_MODEL
        value: deepseek-v4-flash
      - key: AGENTROUTER_VISION_MODEL
        value: deepseek-v4-flash
      - key: AGENTROUTER_DOCUMENT_MODEL
        value: deepseek-v4-flash
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_MODEL
        value: google/gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash

  # 3. React 19 / Vite Frontend Static Site
  - type: web
    name: goveaseai-frontend
    runtime: static
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://goveaseai-backend.onrender.com
